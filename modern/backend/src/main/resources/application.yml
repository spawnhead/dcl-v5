spring:
  application:
    name: dcl-modern-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dcl}
    username: ${DB_USER:dcl}
    password: ${DB_PASSWORD:dcl}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
